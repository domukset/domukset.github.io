  COPY THIS ENTIRE BLOCK.
  Paste it in index.html directly below the "NEW POSTS GO HERE" comment.
  Keep newest posts at the top.
-->

<details class="post">
  <summary>
    <span class="post-date">
      <time datetime="2026-07-26">26.7.2026</time>
    </span>
    <span class="post-title">Write the post title here</span>
    <span class="post-toggle" aria-hidden="true">+</span>
  </summary>

  <div class="post-body">
    <p>
      Write the update here.
    </p>

    <!-- Delete the complete "photos" div if this post has no photos. -->
    <div class="photos">
      <figure>
        <img
          src="images/your-photo.jpg"
          alt="Describe the factual contents of the photo"
          loading="lazy"
        >
        <figcaption>Write a short factual caption.</figcaption>
      </figure>
    </div>
  </div>
</details>
